[project]
name = "bop_erp"
authors = [
    { name = "Bop Agency", email = "info@bop.agency" }
]
description = "Modular industrial distribution ERP extension designed to replace Epicor Prophet 21 workflows while keeping ERPNext and Frappe upstream intact."
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=16.0.0"
erpnext = ">=16.0.0"
